<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | AB Solutions</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css?v=1.5.0">
  <style>
    .nf-wrap { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .nf-code { font-family: var(--font-head); font-size: clamp(4rem, 14vw, 8rem); font-weight: 800;
               background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <div>
      <p class="nf-code">404</p>
      <h1 style="font-size:1.4rem; margin-bottom:.6rem;">Página não encontrada</h1>
      <p style="color:var(--muted); margin-bottom:1.8rem;">O endereço que você acessou não existe ou foi movido.</p>
      <a class="btn btn-primary" href="/">Voltar para o início</a>
    </div>
  </main>
</body>
</html>
